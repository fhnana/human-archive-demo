<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>地月Echo｜月尘擦除交互</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030405;
    font-family: "Noto Serif SC", "Songti SC", "Times New Roman", serif;
    color: rgba(240,245,246,.88);
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 48%, rgba(80,105,120,.12), transparent 42%),
      #030405;
  }

  #archiveImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .96;
    filter: brightness(.88) blur(0px) contrast(1.08) saturate(.82);
    transform: scale(1.004);
    transition: filter 1.15s ease, opacity 1.15s ease, transform 1.15s ease;
  }

  body.revealed #archiveImage {
    opacity: 1;
    filter: brightness(.96) blur(0px) contrast(1.1) saturate(.86);
    transform: scale(1);
  }

  #dynamicLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    mix-blend-mode: screen;
  }

  body.revealed #dynamicLayer {
    opacity: .9;
  }

  .scan-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 360px;
    height: 360px;
    margin-left: -180px;
    margin-top: -170px;
    border: 1px solid rgba(180,220,235,.16);
    border-radius: 50%;
    animation: rotateRing 16s linear infinite;
  }
  .scan-ring::before, .scan-ring::after {
    content: "";
    position: absolute;
    inset: 38px;
    border: 1px dotted rgba(210,235,245,.18);
    border-radius: 50%;
  }
  .scan-ring::after {
    inset: 82px;
    border-style: solid;
    opacity: .55;
  }

  .pulse-dot {
    position: absolute;
    left: 50%;
    bottom: 78px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(235,250,255,.92);
    box-shadow: 0 0 28px rgba(170,220,255,.95);
    animation: pulse 2.6s ease-in-out infinite;
  }

  @keyframes rotateRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(.7); opacity: .45; }
    50% { transform: scale(1.5); opacity: 1; }
  }

  #dustCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: none;
    z-index: 5;
  }

  body.revealed #dustCanvas {
    pointer-events: none;
  }

  .hud {
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    color: rgba(235,245,248,.78);
    mix-blend-mode: screen;
  }

  .top {
    position: absolute;
    left: 52px;
    right: 52px;
    top: 34px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: Arial, sans-serif;
    letter-spacing: .24em;
    font-size: 10px;
    color: rgba(235,245,248,.54);
  }

  .brand {
    line-height: 1.55;
  }

  .brand strong {
    display: block;
    color: rgba(245,250,252,.84);
    font-weight: 400;
    font-size: 13px;
  }

  .status {
    text-align: right;
    line-height: 1.6;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    text-align: center;
    font-family: Arial, sans-serif;
    letter-spacing: .22em;
    font-size: 10px;
    color: rgba(235,245,248,.46);
    transition: opacity .8s ease;
  }

  body.revealed .hint {
    opacity: .18;
  }

  .hint strong {
    display: block;
    margin-bottom: 10px;
    color: rgba(245,250,252,.76);
    font-weight: 400;
    letter-spacing: .28em;
  }

  .progress {
    position: absolute;
    left: 50%;
    bottom: 23px;
    width: 360px;
    height: 1px;
    transform: translateX(-50%);
    background: rgba(255,255,255,.14);
  }

  #bar {
    width: 0%;
    height: 100%;
    background: rgba(225,245,252,.94);
    box-shadow: 0 0 18px rgba(170,220,255,.82);
    transition: width .16s linear;
  }

  .cursor {
    position: fixed;
    z-index: 20;
    width: 56px;
    height: 56px;
    margin-left: -28px;
    margin-top: -28px;
    border-radius: 50%;
    border: 1px solid rgba(220,245,255,.38);
    box-shadow: 0 0 22px rgba(170,220,255,.16);
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s ease, transform .18s ease;
    mix-blend-mode: screen;
  }
  .cursor.active {
    opacity: 1;
    transform: scale(1.35);
  }


  #video {
    position: fixed;
    right: 34px;
    top: 86px;
    width: 250px;
    height: 188px;
    object-fit: cover;
    opacity: .92;
    transform: scaleX(-1);
    border: 1px solid rgba(210,235,245,.42);
    box-shadow: 0 0 28px rgba(120,180,220,.18);
    background: #050607;
    pointer-events: none;
    z-index: 20;
  }
  .camLabel {
    position: fixed;
    right: 34px;
    top: 60px;
    width: 250px;
    height: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: .18em;
    color: rgba(235,245,248,.76);
    z-index: 21;
    pointer-events: none;
  }
  .camLabel::before { content: "CAMERA PREVIEW"; }
  .camLabel::after {
    content: "LIVE";
    color: rgba(170,225,255,.95);
    text-shadow: 0 0 12px rgba(120,190,255,.9);
  }
  .camFrame {
    position: fixed;
    right: 28px;
    top: 54px;
    width: 262px;
    height: 229px;
    border: 1px solid rgba(255,255,255,.12);
    z-index: 19;
    pointer-events: none;
  }
  .handCursor {
    position: fixed;
    z-index: 22;
    width: 78px;
    height: 78px;
    margin-left: -39px;
    margin-top: -39px;
    border-radius: 50%;
    border: 1px solid rgba(220,245,255,.58);
    box-shadow: 0 0 30px rgba(170,220,255,.24);
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s ease, transform .15s ease;
    mix-blend-mode: screen;
  }
  .handCursor.active { opacity: 1; transform: scale(1.2); }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 1px,
      transparent 2px,
      transparent 5px
    );
    opacity: .38;
    mix-blend-mode: overlay;
  }
</style>
</head>

function drawDustLayer() {
  ctx.clearRect(0, 0, W, H);

  const g = ctx.createRadialGradient(W*.5,H*.48,W*.04,W*.5,H*.5,W*.92);
  g.addColorStop(0, "rgba(150,160,160,.88)");
  g.addColorStop(.35, "rgba(96,106,108,.94)");

  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "rgba(180,185,182,.38)";
  ctx.fillRect(0,0,W,H);

  for (let i = 0; i < 22000; i++) {
    const x = Math.random()*W;
    const y = Math.random()*H;
    const big = Math.random() > .86;
    const s = big ? Math.random()*3.8 + 1.2 : Math.random()*1.6 + .35;

    ctx.fillStyle = `rgba(220,225,220,${a})`;
    ctx.fillRect(x,y,s,s);
  }

  for (let i = 0; i < 85; i++) {
    const y = Math.random()*H;
    ctx.beginPath();
    ctx.strokeStyle = `rgba(220,225,220,${Math.random()*0.07 + 0.025})`;
    ctx.lineWidth = Math.random()*4 + .8;
    ctx.moveTo(-240, y);
    ctx.bezierCurveTo(W*.2, y + Math.random()*220 - 110, W*.68, y + Math.random()*190 - 95, W+240, y + Math.random()*140 - 70);
    ctx.stroke();
  }

  for (let i = 0; i < 1200; i++) {
    const x = Math.random()*W;
    const y = Math.random()*H;
    const r = Math.random()*16 + 3;
    const grd = ctx.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, `rgba(0,0,0,${Math.random()*0.12})`);
    grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }
}

function wipe(x, y) {
  if (revealTriggered) return;

  const px = x * devicePixelRatio;
  const py = y * devicePixelRatio;
  const r = Math.min(W, H) * 0.12;

  ctx.save();
  ctx.globalCompositeOperation = "destination-out";

  const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
  grad.addColorStop(0, "rgba(0,0,0,1)");
  grad.addColorStop(.32, "rgba(0,0,0,.88)");
  grad.addColorStop(.62, "rgba(0,0,0,.42)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI*2);
  ctx.fill();

  if (last) {
    ctx.lineWidth = r * .95;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(0,0,0,.68)";
    ctx.beginPath();
    ctx.moveTo(last.x * devicePixelRatio, last.y * devicePixelRatio);
    ctx.lineTo(px, py);
    ctx.stroke();
  }
  ctx.restore();

  last = { x, y };

  cleaned = Math.min(60, cleaned + 0.78);
  const displayRate = Math.round(cleaned);
  bar.style.width = (displayRate / 60 * 100) + "%";
  rateText.textContent = displayRate + "%";

  if (cleaned >= 60) autoReveal();
}

function autoReveal() {
  if (revealTriggered) return;
  revealTriggered = true;

  canvas.style.transition = "opacity 1.15s ease, filter 1.15s ease";
  canvas.style.opacity = "0";
  canvas.style.filter = "blur(18px)";
  document.body.classList.add("revealed");
  rateText.textContent = "60%";
  bar.style.width = "100%";
  if (typeof modeText !== "undefined") modeText.textContent = "ARCHIVE REVEALED";

  setTimeout(() => {
    canvas.style.display = "none";
  }, 1250);
}

canvas.addEventListener("pointerdown", (e) => {
  isDragging = true;
  last = null;
  cursor.classList.add("active");
  wipe(e.clientX, e.clientY);
});

canvas.addEventListener("pointermove", (e) => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
  if (isDragging && !handSeen) wipe(e.clientX, e.clientY);
});

window.addEventListener("pointerup", () => {
  isDragging = false;
  last = null;
  cursor.classList.remove("active");
});

canvas.addEventListener("pointerenter", (e) => {
  cursor.style.opacity = "1";
});
canvas.addEventListener("pointerleave", () => {
  cursor.style.opacity = "0";
  isDragging = false;
  last = null;
});


async function startHands() {
  try {
    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.58,
      minTrackingConfidence: 0.58
    });

    hands.onResults(results => {
      if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
        last = null;
        handCursor.classList.remove("active");
        if (!revealTriggered) modeText.textContent = "CAMERA ON / SHOW YOUR HAND";
        return;
      }

      handSeen = true;
      if (!revealTriggered) modeText.textContent = "HAND DETECTED / WIPE DUST";

      const lm = results.multiHandLandmarks[0];
      const indexTip = lm[8];
      const middleMcp = lm[9];
      const pinkyMcp = lm[17];

      // 镜像摄像头，让右上角画面和屏幕擦除方向一致
      const x = (1 - indexTip.x) * window.innerWidth;
      const y = indexTip.y * window.innerHeight;

      // 手越靠近摄像头，擦除范围越大
      const palmSpan = Math.hypot(pinkyMcp.x - middleMcp.x, pinkyMcp.y - middleMcp.y);
      const strength = Math.min(1.65, Math.max(.95, palmSpan * 9));

      handCursor.style.left = x + "px";
      handCursor.style.top = y + "px";
      handCursor.classList.add("active");

      wipe(x, y, strength);
    });

    const cam = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640,
      height: 480
    });

    await cam.start();
    modeText.textContent = "CAMERA ON / SHOW YOUR HAND";
  } catch (err) {
    console.warn(err);
    modeText.textContent = "CAMERA FAILED / MOUSE FALLBACK";
    alert("摄像头没有启动：请允许浏览器摄像头权限，并尽量用 localhost 或 https 打开。现在可以用鼠标按住拖动模拟擦除月尘。");
  }
}

resize();
startHands();
</script>
</body>
</html>
